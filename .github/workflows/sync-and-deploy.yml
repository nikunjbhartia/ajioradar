name: Sync Deals & Deploy to Cloudflare Pages

on:
  schedule:
    # Run every 30 minutes (24/7 free automated sync)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI
  push:
    branches:
      - main

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Cache Persistent Deals Database (Zero Billing)
        uses: actions/cache@v4
        with:
          path: |
            backend/deals.db
            backend/deals.db-wal
            backend/deals.db-shm
          key: ajio-deals-db-${{ github.run_id }}
          restore-keys: |
            ajio-deals-db-

      - name: Restore Previous SQLite Database from Cloudflare R2 (Optional)
        continue-on-error: true
        env:
          PYTHONPATH: backend
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_S3_API_ENDPOINT: ${{ secrets.R2_S3_API_ENDPOINT }}
        run: |
          python3 backend/app/database/r2_sync.py restore || true

      - name: Run Live Validation & Category Sweeps
        env:
          PYTHONPATH: backend
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_S3_API_ENDPOINT: ${{ secrets.R2_S3_API_ENDPOINT }}
        run: |
          cd backend
          python -c "
          import sys; sys.path.insert(0, '.')
          from app.services.sync_daemon import daemon_instance
          daemon_instance.perform_full_sync()
          "

      - name: Export Static Bundle to dist/
        env:
          PYTHONPATH: backend
        run: |
          cd backend
          python export_cloudflare.py

      - name: Backup Updated Database to Cloudflare R2 (Optional)
        continue-on-error: true
        env:
          PYTHONPATH: backend
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_S3_API_ENDPOINT: ${{ secrets.R2_S3_API_ENDPOINT }}
        run: |
          python3 backend/app/database/r2_sync.py backup || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ajioradar
