name: Sync Deals & Deploy to Cloudflare Pages

on:
  schedule:
    # Run every 30 minutes (24/7 free automated sync)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI
  push:
    branches:
      - main

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Live Validation & Category Sweeps
        env:
          PYTHONPATH: backend
        run: |
          cd backend
          python -c "
          import sys; sys.path.insert(0, '.')
          from app.services.sync_daemon import daemon_instance
          daemon_instance.perform_full_sync()
          "

      - name: Export Static Bundle to dist/
        env:
          PYTHONPATH: backend
        run: |
          cd backend
          python export_cloudflare.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ajioradar
